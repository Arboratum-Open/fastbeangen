plugins { id 'org.springframework.boot' }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation project(':fastbeangen')
    implementation 'org.apache.commons:commons-pool2:2.13.1'
    implementation 'org.jcommander:jcommander:3.0'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.hsqldb:hsqldb'
    implementation 'com.opencsv:opencsv:5.12.0'
}

tasks.named('bootJar') {
    mainClass = 'com.arboratum.beangen.example1.SimpleGenAndQueryTest'
}

tasks.register('runGeneration', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.arboratum.beangen.example1.SimpleGenAndQueryTest'
    args '--persons', '10000', '--relations', '2', 'generate'
    doFirst { layout.buildDirectory.dir('demo-data').get().asFile.deleteDir() }
}

tasks.register('runQueryTest', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.arboratum.beangen.example1.SimpleGenAndQueryTest'
    args '--persons', '10000', '--relations', '2', 'query'
    jvmArgs '-Xmx8G'
}

tasks.register('runCudAndQueryTest', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.arboratum.beangen.example1.SimpleGenAndQueryTest'
    args '--persons', '10000', '--relations', '2', 'cud'
    jvmArgs '-Xmx8G'
}

tasks.register('runGenCVS', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.arboratum.beangen.example1.DatabaseGeneratorAsCSVTest'
    jvmArgs '-Xmx8G'
    args '--persons', '1000000', '--relations', '20000'
    doFirst { fileTree(layout.buildDirectory).include('*.csv').each { it.delete() } }
}
