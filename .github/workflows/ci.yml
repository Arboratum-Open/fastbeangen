name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Compile, test, assemble and publish locally
        run: ./gradlew --no-daemon --console=plain --max-workers=1 -PjavaVersion=${{ matrix.java }} check assemble publishAllPublicationsToLocalRepository
      - name: Verify local Maven artifacts
        run: python3 verification/verify-publication.py
      - name: Consume published dependencies
        run: ./gradlew --project-dir verification/consumer --no-daemon --console=plain --max-workers=1 -PjavaVersion=${{ matrix.java }} run
      - name: Exercise bounded embedded-database examples
        run: python3 verification/verify-examples.py ${{ matrix.java }}
