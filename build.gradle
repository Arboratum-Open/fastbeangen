plugins {
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'se.bjurr.gitchangelog.git-changelog-gradle-plugin' version '3.4.2'
}

subprojects {
    group = 'com.arboratum'
    version = '0.3.0'
    apply plugin: 'java-library'

    repositories { mavenCentral() }

    def buildJavaVersion = JavaLanguageVersion.of(providers.gradleProperty('javaVersion').getOrElse('21').toInteger())
    java {
        toolchain { languageVersion = buildJavaVersion }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }
    dependencies {
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.hamcrest:hamcrest:3.0'
    }
    tasks.withType(Test).configureEach {
        useJUnit()
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = buildJavaVersion
        }
        maxHeapSize = '4g'
        workingDir = layout.buildDirectory.dir('test-work').get().asFile
        doFirst { workingDir.mkdirs() }
    }
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor { languageVersion = buildJavaVersion }
    }
}

configure(subprojects.findAll { it.name != 'fastbeangen-example' }) {
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    java {
        withSourcesJar()
        withJavadocJar()
    }
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = "FastBeanGen - ${project.name}"
                    description = 'FastBeanGen is an idempotent random bean generator'
                    url = 'https://github.com/Arboratum-Open/fastbeangen'
                    licenses {
                        license {
                            name = 'GNU General Public License, Version 3'
                            url = 'https://www.gnu.org/licenses/gpl-3.0.html'
                        }
                    }
                    developers {
                        developer {
                            id = 'gpicron'
                            name = 'Geoffrey Picron'
                            email = 'geoffrey.picron@arboratum.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/Arboratum-Open/fastbeangen.git'
                        developerConnection = 'scm:git:ssh://git@github.com/Arboratum-Open/fastbeangen.git'
                        url = 'https://github.com/Arboratum-Open/fastbeangen'
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'Local'
                url = rootProject.layout.buildDirectory.dir('repository')
            }
        }
    }
    signing {
        def key = providers.environmentVariable('SIGNING_KEY')
        if (key.present) {
            useInMemoryPgpKeys(key.get(), providers.environmentVariable('SIGNING_PASSWORD').getOrElse(''))
            sign publishing.publications.mavenJava
        }
    }
}

tasks.register('bundleCentral', Zip) {
    dependsOn ':fastbeangen:publishAllPublicationsToLocalRepository', ':fastbeangen-doc:publishAllPublicationsToLocalRepository'
    archiveFileName = 'fastbeangen-central.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('repository')) {
        include "com/arboratum/*/${project(':fastbeangen').version}/**"
    }
    doFirst {
        if (!providers.environmentVariable('SIGNING_KEY').present) {
            throw new GradleException('SIGNING_KEY is required for a signed Central bundle; local publication checks do not need it.')
        }
    }
}

tasks.register('generateChangelog', se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask) {
    filePath = 'CHANGELOG_tmp.md'
}
