plugins {
    id 'java-base'
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'se.bjurr.gitchangelog.git-changelog-gradle-plugin' version '3.4.2'
}

subprojects {
    group = 'com.arboratum'
    version = '0.3.0'
    apply plugin: 'java-library'

    repositories { mavenCentral() }

    def buildJavaVersion = JavaLanguageVersion.of(providers.gradleProperty('javaVersion').getOrElse('21').toInteger())
    java {
        toolchain { languageVersion = buildJavaVersion }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }
    dependencies {
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.hamcrest:hamcrest:3.0'
    }
    tasks.withType(Test).configureEach {
        useJUnit()
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = buildJavaVersion
        }
        maxHeapSize = '4g'
        workingDir = layout.buildDirectory.dir('test-work').get().asFile
        doFirst { workingDir.mkdirs() }
    }
    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor { languageVersion = buildJavaVersion }
    }
    tasks.withType(Jar).configureEach {
        from(rootProject.files('LICENSE', 'COPYING')) { into 'META-INF' }
    }
}

configure(subprojects.findAll { it.name != 'fastbeangen-example' }) {
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    java {
        withSourcesJar()
        withJavadocJar()
    }
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                pom {
                    name = "FastBeanGen - ${project.name}"
                    description = 'FastBeanGen is an idempotent random bean generator'
                    url = 'https://github.com/Arboratum-Open/fastbeangen'
                    licenses {
                        license {
                            name = 'GNU Lesser General Public License, Version 3.0 only (LGPL-3.0-only)'
                            url = 'https://www.gnu.org/licenses/lgpl-3.0.html'
                        }
                    }
                    developers {
                        developer {
                            id = 'gpicron'
                            name = 'Geoffrey Picron'
                            email = 'geoffrey.picron@arboratum.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/Arboratum-Open/fastbeangen.git'
                        developerConnection = 'scm:git:ssh://git@github.com/Arboratum-Open/fastbeangen.git'
                        url = 'https://github.com/Arboratum-Open/fastbeangen'
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'Local'
                url = rootProject.layout.buildDirectory.dir('repository')
            }
        }
    }
    signing {
        def key = providers.environmentVariable('SIGNING_KEY')
        if (key.present && !key.get().isBlank()) {
            useInMemoryPgpKeys(key.get(), providers.environmentVariable('SIGNING_PASSWORD').getOrElse(''))
            sign publishing.publications.mavenJava
        }
    }
}

def verificationJavaVersion = JavaLanguageVersion.of(providers.gradleProperty('javaVersion').getOrElse('21').toInteger())
java { toolchain { languageVersion = verificationJavaVersion } }
sourceSets {
    verification { java.srcDir 'verification/src/main/java' }
    verificationTest {
        java.srcDir 'verification/src/test/java'
        compileClasspath += sourceSets.verification.output
        runtimeClasspath += sourceSets.verification.output
    }
}
configurations.verificationTestImplementation.extendsFrom(configurations.verificationImplementation)
configurations.verificationTestRuntimeOnly.extendsFrom(configurations.verificationRuntimeOnly)
repositories { mavenCentral() }
dependencies {
    // Build-only JSON/ZIP facilities already supplied by Gradle; never library dependencies.
    verificationImplementation fileTree(dir: new File(gradle.gradleHomeDir, 'lib'), include: ['ant-*.jar'])
    verificationImplementation localGroovy()
    verificationImplementation 'com.opencsv:opencsv:5.12.0'
    verificationTestImplementation 'junit:junit:4.13.2'
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    useJUnit()
    javaLauncher = javaToolchains.launcherFor { languageVersion = verificationJavaVersion }
    testClassesDirs = sourceSets.verificationTest.output.classesDirs
    classpath = sourceSets.verificationTest.runtimeClasspath
    systemProperty 'fastbeangen.root', rootDir.absolutePath
    systemProperty 'fastbeangen.javaVersion', verificationJavaVersion.asInt()
    maxHeapSize = '1g'
}
tasks.register('verificationTest', Test) {
    description = 'Run Java/JUnit publication and release guard regressions.'
    exclude '**/*IntegrationTest.class'
}
tasks.named('check') { dependsOn 'verificationTest' }

def localPublications = [':fastbeangen:publishAllPublicationsToLocalRepository', ':fastbeangen-doc:publishAllPublicationsToLocalRepository']
tasks.register('verifyPublication', Test) {
    dependsOn localPublications, ':fastbeangen-example:assemble'
    include '**/PublicationIntegrationTest.class'
    outputs.upToDateWhen { false }
}
tasks.register('verifyReference', Test) {
    description = 'Compare pinned published APIs/protected inputs and characterize the original Java 21 failures.'
    dependsOn localPublications
    include '**/ReferenceIntegrationTest.class'
    outputs.upToDateWhen { false }
}
tasks.register('verifySigningGuards', Test) {
    include '**/SigningIntegrationTest.class'
    outputs.upToDateWhen { false }
}
tasks.register('verifyExamples', Test) {
    dependsOn ':fastbeangen-example:classes'
    include '**/ExamplesIntegrationTest.class'
    doFirst {
        systemProperty 'fastbeangen.exampleJava', javaLauncher.get().executablePath.asFile.absolutePath
        systemProperty 'fastbeangen.exampleClasspath', project(':fastbeangen-example').sourceSets.main.runtimeClasspath.asPath
    }
    outputs.upToDateWhen { false }
}
['stageRelease': 'stage', 'verifyRelease': 'verify', 'verifyCentralInputs': 'central-inputs', 'verifyCentralBundle': 'central-bundle'].each { taskName, action ->
    tasks.register(taskName, JavaExec) {
        dependsOn localPublications
        javaLauncher = javaToolchains.launcherFor { languageVersion = verificationJavaVersion }
        classpath = sourceSets.verification.runtimeClasspath
        mainClass = 'com.arboratum.beangen.verification.ReleaseVerification'
        systemProperty 'fastbeangen.root', rootDir.absolutePath
        args action
    }
}
tasks.named('verifyCentralInputs') {
    doFirst {
        if (providers.environmentVariable('SIGNING_KEY').getOrElse('').isBlank()) {
            throw new GradleException('SIGNING_KEY is required for a signed Central bundle; local publication checks do not need it.')
        }
    }
}

tasks.register('bundleCentral', Zip) {
    dependsOn 'verifyCentralInputs'
    archiveFileName = 'fastbeangen-central.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('repository')) {
        include "com/arboratum/fastbeangen/${project(':fastbeangen').version}/**"
        include "com/arboratum/fastbeangen-doc/${project(':fastbeangen-doc').version}/**"
    }
}

tasks.register('generateChangelog', se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask) {
    filePath = 'CHANGELOG_tmp.md'
}
