    text: "A2: Focused reference-backed tests demonstrate the restored runtime
      contracts: bounded filtered/transformed selection returns null on
      exhausted/non-positive budgets or empty input as published, budgets
      propagate through applicable union/transformed views, initial-entry
      provenance remains correct, deletion predicates receive Entry values and
      update predicates receive the matching EntryRef. Tests include
      rejection/exhaustion paths and do not silently import unrelated historical
      defects."
    result: passed
    reason:
