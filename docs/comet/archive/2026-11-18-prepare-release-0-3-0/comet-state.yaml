    text: "A1: The published core/document 0.2.17 API comparison has pinned artifact
      provenance and identifies all in-scope gaps; an independent consumer using
      the restored overloads, entry provenance, entry-aware deletion and
      reference-aware updates compiles against the candidate's locally published
      artifacts. Current compatible entry points are retained, and any
      unavoidable source migration is explicitly documented."
