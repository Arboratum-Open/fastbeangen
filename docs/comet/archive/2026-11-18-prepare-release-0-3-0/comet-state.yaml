    reason:
      text: Independently reviewed the six official binary/source/POM SHA-256 pins,
        ReferenceIntegrationTest, restored interfaces/implementations, isolated
        POM-only consumer and migration documentation. Current Runtime
        published-api-reference-invariants passes the finite
        59-public-class/358-descriptor comparison, including DataView
        inheritance; java21-consumer and java25-consumer both pass against the
        two local 0.3.0 publications. Convenience overloads and the one-argument
        update hook remain available; deletion-predicate erasure and custom
        Entry/DataView source migrations are explicitly documented.
      truncated: false
  - id: A2
