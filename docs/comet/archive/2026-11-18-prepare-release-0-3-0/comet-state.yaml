        positive/zero/negative/exhausted/empty selection, composition/union,
        created versus initial/deleted provenance, deletion and
        accepted/rejected updates; all eight pass in candidate suites on both
        JDKs. The independent official 0.2.17 run remains exit 1 with five
        passes and three named characterized defects, rather than importing or
        disguising those defects.
