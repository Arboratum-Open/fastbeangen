acceptance:
  - id: A1
    source: brief.md
    text: All three modules compile and their applicable existing and added tests
      pass on actual Java 21 and actual Java 25; produced library bytecode
      targets Java 21, and the Gradle wrapper/check commands are reproducible
      and documented.
    result: passed
    reason:
      text: Reused bound java21-build-test-publish and java25-build-test-publish
        receipts. Independently inspected logs showing actual Temurin 21.0.11
        and 25.0.5 compilers and matching test executors, with all three modules
        compiled; the example module has no unit-test sources and is covered by
        smoke checks. Current report audit confirms 60 core and 6 document
        tests, zero failures/errors/skips. Root options.release=21 and
        publication validation for both builds establish Java 21
        classfiles/variants. Wrapper SHA-256 matches the documented value;
        distribution URL/checksum and reproducible commands are checked in.
      truncated: false
  - id: A2
    source: brief.md
    text: The build uses pinned stable compatible dependencies and supported Gradle
      declarations, resolves from supported repositories without
      JCenter/Bintray, and does not introduce dynamic/pre-release versions or
      conceal unresolved dependency limitations.
    result: passed
    reason:
      text: "Inspected root/settings and all three module build files: direct
        dependency/plugin versions are fixed stable versions, framework
        transitives use the pinned Boot BOM, resolution uses Maven
        Central/plugin portal, and modern java-library, toolchain, publishing
        and dependency declarations replace obsolete configuration. Both
        complete Runtime builds and POM-only consumers resolve successfully.
        Retained Commons Math/PalDB age and lack of an upstream-maintenance
        guarantee are explicitly documented rather than represented as resolved
        maintenance."
      truncated: false
  - id: A3
    source: brief.md
    text: Upgrade-sensitive seeded generator/data-set behavior matches recorded
      historical references; the pseudo-random algorithm is preserved,
      new-version reproducibility is tested, and every detected difference is
      either resolved or individually documented with explicit owner acceptance.
      No test oracle, scenario, size tolerance, or statistical check is weakened
      to obtain a pass.
    result: passed
    reason:
      text: The original-tests-prng-preserved Runtime check confirms all 27 original
        test files and RandomSequence source are byte-identical to baseline
        7cfaf9bfb699f38f02d5cb87cfe81fe162348c47. Independently inspected the
        baseline-to-candidate source diff, preserved literal dataset sequences
        and Monte Carlo expectations, eight fixed PRNG/regex/date reference
        vectors with baseline/capture provenance, and new
        reproducibility/acknowledgement/update/union tests. These run in the
        completed Java 21/25 suites without changing original oracles, scenarios
        or tolerances. The internal null-list/version-only constructor repair
        restores existing literal expectations; it does not replace the working
        weighted-update algorithm. No unresolved changed-output exception was
        detected; finite reference coverage and the historical-wrapper
        limitation remain explicit.
      truncated: false
  - id: A4
    source: brief.md
    text: Existing example entry points and DOCX/XLSX generation remain usable after
      necessary API adaptations; module tests and bounded smoke checks cover the
      relevant upgrade surfaces without removing existing functions or requiring
      unbounded generation/external services.
    result: passed
    reason:
      text: "Inspected necessary Jakarta/JPA, OpenCSV, JCommander and Reactor
        adaptations against the original implementation; existing entry
        points/functions remain. Reused both bounded-example Runtime receipts
        covering query, six CUD checkpoints and CSV person/relation/link
        validation with embedded HSQLDB. Filled the zero-relation SQL coverage
        gap through verifier-sql-relations-java21: 10 persons per country plus 2
        relations generated successfully, reporting 22 stored entities. Both
        runtime suites retain original DOCX/XLSX size tests and add bounded
        XML/cell-content checks; independent published consumers also generate
        and inspect both document formats."
      truncated: false
  - id: A5
    source: brief.md
    text: Local publication preparation produces consumable library/document-module
      artifacts and valid Maven metadata with the intended coordinates,
      sources/Javadoc and signing/upload instructions suitable for Maven
      Central; no remote artifact upload is performed and ordinary checks
      require no secrets.
    result: passed
    reason:
      text: Inspected local-only Maven publication, optional in-memory signing and
        guarded Central bundle configuration. Reused both publication/consumer
        receipts and added verifier-java25-publication-validation for the
        Java25-produced repository. Both com.arboratum:fastbeangen:0.3.0 and
        fastbeangen-doc:0.3.0 have validated Java21 binaries/variants, sources,
        Javadoc, checksums and project/license/developer/SCM POM metadata. The
        separate consumer enforces local com.arboratum resolution and Maven-POM
        metadata without project dependencies or Gradle-metadata fallback.
        Signing, namespace and Portal prerequisites are documented; ordinary
        checks need no secrets and no remote uploader is configured.
      truncated: false
  - id: A6
    source: brief.md
    text: CI declares Java 21 and Java 25 build/test jobs; README, changelog, and
      migration documentation accurately describe supported Java versions,
      commands, useful API changes, historical-reference coverage and accepted
      exceptions, and the distinction between publication-ready and actually
      published.
    result: passed
    reason:
      text: Independently read CI, README, changelog and complete modernization
        documentation. CI declares Java21/25
        compilation/check/local-consumption/example jobs with pinned
        checkout/setup-java actions and read-only contents permission, without
        publication/secrets. Documentation matches the actual toolchain/release
        settings, commands, necessary API/scheduler changes, finite historical
        references and inherited constructor repair. It distinguishes configured
        remote CI from executed local evidence and unreleased local artifacts
        from an actually published Central release.
      truncated: false
