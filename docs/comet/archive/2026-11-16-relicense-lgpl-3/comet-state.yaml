    text: Focused verifier self-checks demonstrate detection of wrong/missing
      license metadata or packaged texts. Local publication/archive checks and
      the existing independent consumer smoke run on actual Java 21 and 25,
      without remote publication. A reviewed diff confirms no changes to Java
