    result: passed
    reason:
      text: "Reviewed focused self-tests and the verifier diff: all unrelated
        coordinate, required-metadata, file-presence, checksum,
        archive-integrity/content, classfile and Gradle-variant predicates
        remain effective; license checks are stronger. Runtime
