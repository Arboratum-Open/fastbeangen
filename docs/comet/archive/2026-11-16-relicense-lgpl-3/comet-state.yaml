  - id: A1
    source: brief.md
    text: The repository explicitly grants `LGPL-3.0-only` for the current
      first-party project. `LICENSE` is the canonical LGPL v3 text and `COPYING`
      exactly preserves the previous GPL v3 text; both are included rather than
      claiming LGPL is an unrelated standalone permissive license.
    result: passed
    reason:
      text: Independently read the complete brief, target Spec, LICENSE, COPYING and
        README grant. README and Gradle metadata explicitly select LGPL-3.0-only
        without later-version permission. Runtime publication-java21 and
        publication-java25 validate the LGPL SHA-256 against the confirmed
        official reference and both repository legal texts against pinned
        hashes; scope-invariants compares COPYING byte-for-byte with LICENSE at
        confirmed base 6416eddfe6b38499ba647cfbda1b584a8327e327. Both
        incorporated texts are supplied and LGPL is correctly described as weak
        copyleft.
      truncated: false
  - id: A2
    source: brief.md
    text: Local core/document publication POMs consistently name and link the
      selected grant. All first-party JAR variants produced by existing build
      tasks, including binary, sources, Javadoc and executable examples where
      applicable, contain the two correct legal texts without duplicate
      first-party license entries. Existing coordinates and publication variants
      are retained.
    result: passed
    reason:
      text: "Reviewed shared Jar-task packaging in build.gradle and independently read
        both actual generated publication POMs: the exact LGPL-3.0-only name and
        canonical GNU URL agree, and com.arboratum coordinates/version remain
        unchanged. Passed Runtime publication-java21 and added
        publication-java25 inspect the six core/document binary, sources and
        Javadoc JARs plus both example JARs, requiring exactly one
        META-INF/LICENSE and META-INF/COPYING with correct bytes. Existing
        checks also validate checksums, Java 21 classfile/variant targets,
        source/Javadoc contents and publication metadata. Reviewed Gradle diff
        retains existing publication variants and topology."
      truncated: false
  - id: A3
    source: brief.md
    text: Current README, unreleased changelog and publication/migration guidance
      agree with the selected grant, describe the LGPL obligations without
      promising unrestricted proprietary redistribution, distinguish first-party
      and third-party material, and do not claim a Central release or
      independently verified legal ownership. The owner's rights attestation is
      retained in this brief.
    result: passed
    reason:
      text: Independently read README.md, CHANGELOG.md, docs/modernization.md and the
        owner attestation in the brief. Current licensing statements agree on
        LGPL-3.0-only, identify both legal texts, preserve third-party licensing
        and previous GPL rights, and describe notices, corresponding source,
        modification/reverse-engineering and replacement/relinking conditions
        without promising unrestricted proprietary redistribution. Guidance
        explicitly identifies 0.3.0 as unreleased and preserves
        signing/namespace/upload prerequisites; no independent legal-clearance
        or Central-release claim is made.
      truncated: false
  - id: A4
    source: brief.md
    text: Wrapper/dependency notices, historical release/Comet evidence, and
      previously granted GPL rights are preserved. References to GPL as
      incorporated base terms or historical/dependency licensing remain valid;
      no blanket replacement removes them. No unrelated repository, private
      prototype material, or bootstrap file is added to the implementation
