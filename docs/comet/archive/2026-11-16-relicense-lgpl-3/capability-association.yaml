      # FastBeanGen modern Java build and compatibility contract


      ## Purpose and supported project


      FastBeanGen is a deterministic pseudo-random data-generation library with
      its existing core module, executable examples, and document-generation
      module. The supported project consists of `fastbeangen`,
      `fastbeangen-example`, and `fastbeangen-doc`, built together with the
      repository's Gradle wrapper. This capability modernizes the technical
      platform without adding generator functions or replacing the existing
      project architecture.


      ## Java and Gradle support


      The minimum supported consumer runtime is J
